<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VELORA — Maximum Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #03050c;
    --cyan: #22d3ee;
    --pink: #f472b6;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: #e2e8f0;
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x: hidden;
  }

  .heading { font-family: 'Orbitron', sans-serif; }

  .glass {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
  }

  /* 3D Logo */
  .logo-3d {
    transform-style: preserve-3d;
    animation: floatLogo 6s ease-in-out infinite;
    transition: all 0.6s cubic-bezier(0.23,1,0.32,1);
  }
  .logo-3d:hover {
    transform: rotateY(40deg) rotateX(20deg) scale(1.18);
    filter: drop-shadow(0 0 35px rgba(34,211,238,0.8));
    animation: none;
  }
  @keyframes floatLogo {
    0%,100% { transform: translateY(0) rotateY(0deg); }
    50% { transform: translateY(-10px) rotateY(15deg); }
  }

  .card-3d {
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
    will-change: transform;
  }

  .section {
    display: none;
    opacity: 0;
    transform: translateY(40px);
    transition: all 0.55s cubic-bezier(0.23,1,0.32,1);
  }
  .section.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  .nav-tab { position: relative; transition: 0.3s; }
  .nav-tab.active { color: white; }
  .nav-tab.active::after {
    content: '';
    position: absolute;
    bottom: -3px; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, #22d3ee, #f472b6);
    box-shadow: 0 0 15px #22d3ee;
  }

  #three-container {
    width: 100%;
    height: 480px;
    border-radius: 1.25rem;
    overflow: hidden;
    position: relative;
  }

  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 0 0 rgba(34,211,238,0.7);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,211,238,0.7); }
    70% { box-shadow: 0 0 0 12px rgba(34,211,238,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,211,238,0); }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="sticky top-0 z-50 glass border-b border-white/10">
  <div class="max-w-screen-2xl mx-auto px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="logo-3d w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 via-purple-500 to-pink-500 flex items-center justify-center">
        <span class="text-white font-bold text-xl">V</span>
      </div>
      <span class="heading text-xl font-bold tracking-tight">VELORA</span>
    </div>

    <div class="hidden md:flex items-center gap-1 text-sm">
      <button onclick="switchTab('discover')" class="nav-tab active px-4 py-2" id="tab-discover">Discover</button>
      <button onclick="switchTab('stories')" class="nav-tab px-4 py-2" id="tab-stories">Stories</button>
      <button onclick="switchTab('markets')" class="nav-tab px-4 py-2" id="tab-markets">Markets</button>
      <button onclick="switchTab('bookmarks')" class="nav-tab px-4 py-2" id="tab-bookmarks">Bookmarks</button>
      <button onclick="switchTab('explore')" class="nav-tab px-4 py-2" id="tab-explore">Explore</button>
    </div>

    <div class="w-9 h-9 rounded-full overflow-hidden ring-2 ring-white/20">
      <img src="https://i.pravatar.cc/40?u=rose" class="w-full h-full object-cover">
    </div>
  </div>
</nav>

<!-- DISCOVER -->
<div id="discover" class="section active">
  <div class="max-w-screen-2xl mx-auto px-6 pt-20 pb-24">
    <div class="max-w-2xl">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs mb-8">
        <div class="live-dot"></div>
        MAXIMUM EXPERIENCE
      </div>
      <h1 class="heading text-5xl md:text-7xl font-bold leading-none mb-6">
        Beyond<br>
        <span class="bg-gradient-to-r from-cyan-400 to-pink-400 bg-clip-text text-transparent">ordinary</span>
      </h1>
      <p class="text-lg text-slate-400 mb-10">
        Extreme 3D • Live particles • Cinematic motion
      </p>
      <div class="flex gap-4">
        <button onclick="switchTab('markets')" class="px-8 py-4 bg-white text-black font-semibold rounded-2xl hover:scale-105 transition">
          Enter Markets
        </button>
        <button onclick="switchTab('stories')" class="px-8 py-4 border border-white/20 rounded-2xl hover:bg-white/5 transition">
          View Stories
        </button>
      </div>
    </div>
  </div>
</div>

<!-- STORIES -->
<div id="stories" class="section">
  <div class="max-w-screen-2xl mx-auto px-6 pt-14 pb-24">
    <h2 class="heading text-4xl font-bold mb-2">Stories</h2>
    <p class="text-slate-400 mb-10">Selected narratives</p>
    <div id="blog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </div>
</div>

<!-- MARKETS (Three.js lives here) -->
<div id="markets" class="section">
  <div class="max-w-screen-2xl mx-auto px-6 pt-14 pb-24">
    <div class="flex items-end justify-between mb-8">
      <div>
        <h2 class="heading text-4xl font-bold">Markets</h2>
        <p class="text-slate-400">WebGL particles + bloom</p>
      </div>
      <div class="flex items-center gap-2 text-xs px-4 py-1.5 rounded-full bg-cyan-500/10 text-cyan-400">
        <div class="live-dot"></div> LIVE
      </div>
    </div>

    <!-- Coin cards -->
    <div id="coin-cards" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-10"></div>

    <!-- THREE.JS CANVAS -->
    <div class="glass rounded-3xl p-4 md:p-6">
      <div class="flex items-center justify-between mb-4 px-2">
        <div>
          <div class="text-sm text-slate-400">Bitcoin</div>
          <div class="text-2xl font-bold" id="live-price">$—</div>
        </div>
        <div class="text-right">
          <div class="text-sm text-slate-400">24h Change</div>
          <div id="live-change" class="font-medium">—</div>
        </div>
      </div>
      <div id="three-container"></div>
    </div>
  </div>
</div>

<!-- BOOKMARKS -->
<div id="bookmarks" class="section">
  <div class="max-w-screen-2xl mx-auto px-6 pt-14 pb-24">
    <h2 class="heading text-4xl font-bold mb-2">Bookmarks</h2>
    <p class="text-slate-400 mb-10">Your saved pieces</p>
    <div id="bookmarks-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>
</div>

<!-- EXPLORE -->
<div id="explore" class="section">
  <div class="max-w-screen-2xl mx-auto px-6 pt-14 pb-24">
    <h2 class="heading text-4xl font-bold mb-10">Explore</h2>
    <div class="grid md:grid-cols-2 gap-6">
      <div class="glass rounded-3xl p-8">
        <h3 class="text-xl font-semibold mb-4">Trending</h3>
        <div id="trending" class="space-y-3 text-sm"></div>
      </div>
      <div class="glass rounded-3xl p-8">
        <h3 class="text-xl font-semibold mb-4">Categories</h3>
        <div class="flex flex-wrap gap-3" id="categories"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ===================== BASIC DATA =====================
const posts = [
  {id:1, title:"The Quiet Revolution of AI", category:"Tech", excerpt:"AI as creative partner.", image:"https://picsum.photos/id/1015/800/500", author:"Zain"},
  {id:2, title:"Hunza in Winter", category:"Travel", excerpt:"When silence speaks.", image:"https://picsum.photos/id/1005/800/500", author:"Ayesha"},
  {id:3, title:"Emotional Storytelling", category:"Culture", excerpt:"Whispers over noise.", image:"https://picsum.photos/id/29/800/500", author:"Rose"},
  {id:4, title:"Digital Minimalism", category:"Lifestyle", excerpt:"Attention is luxury.", image:"https://picsum.photos/id/160/800/500", author:"Sara"}
];

// ===================== TAB SYSTEM =====================
function switchTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  setTimeout(() => document.getElementById(name).classList.add('active'), 40);

  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name)?.classList.add('active');

  if (name === 'markets') {
    setTimeout(() => initThree(), 100);
  }
  if (name === 'stories') renderStories();
  if (name === 'bookmarks') renderBookmarks();
}

// ===================== 3D TILT =====================
function addTilt(el) {
  el.addEventListener('mousemove', e => {
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = `perspective(1000px) rotateX(${y * -12}deg) rotateY(${x * 12}deg) scale(1.03)`;
  });
  el.addEventListener('mouseleave', () => {
    el.style.transition = 'transform 0.6s cubic-bezier(0.23,1,0.32,1)';
    el.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
    setTimeout(() => el.style.transition = '', 600);
  });
}

// ===================== STORIES =====================
function renderStories() {
  const grid = document.getElementById('blog-grid');
  grid.innerHTML = '';
  posts.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card-3d glass rounded-2xl overflow-hidden cursor-pointer';
    card.innerHTML = `
      <div class="h-44 overflow-hidden">
        <img src="${p.image}" class="w-full h-full object-cover">
      </div>
      <div class="p-5">
        <div class="text-xs text-cyan-400 mb-1">${p.category}</div>
        <h3 class="font-semibold">${p.title}</h3>
        <p class="text-sm text-slate-400 mt-2">${p.excerpt}</p>
      </div>
    `;
    addTilt(card);
    grid.appendChild(card);
  });
}

function renderBookmarks() {
  document.getElementById('bookmarks-grid').innerHTML = `
    <div class="text-slate-500 text-center py-16 col-span-full">No bookmarks yet</div>
  `;
}

// ===================== COIN CARDS =====================
const COINS = [
  {id:'bitcoin', symbol:'BTC', name:'Bitcoin'},
  {id:'ethereum', symbol:'ETH', name:'Ethereum'},
  {id:'solana', symbol:'SOL', name:'Solana'},
  {id:'binancecoin', symbol:'BNB', name:'BNB'},
  {id:'ripple', symbol:'XRP', name:'XRP'}
];

let livePrices = {};

async function fetchPrices() {
  try {
    const ids = COINS.map(c => c.id).join(',');
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
    const data = await res.json();
    COINS.forEach(c => {
      if (data[c.id]) {
        livePrices[c.id] = {
          price: data[c.id].usd,
          change: data[c.id].usd_24h_change || 0
        };
      }
    });
    renderCoins();
    if (livePrices.bitcoin) {
      document.getElementById('live-price').textContent = '$' + livePrices.bitcoin.price.toLocaleString();
      const ch = livePrices.bitcoin.change;
      document.getElementById('live-change').textContent = (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%';
      document.getElementById('live-change').className = ch >= 0 ? 'text-emerald-400 font-medium' : 'text-red-400 font-medium';
    }
  } catch(e) {
    console.log('Price fetch failed, using simulation');
  }
}

function renderCoins() {
  const box = document.getElementById('coin-cards');
  box.innerHTML = '';
  COINS.forEach(c => {
    const p = livePrices[c.id] || {price:0, change:0};
    const div = document.createElement('div');
    div.className = 'card-3d glass rounded-2xl p-5 cursor-pointer';
    div.innerHTML = `
      <div class="flex justify-between">
        <div>
          <div class="font-semibold">${c.name}</div>
          <div class="text-xs text-slate-400">${c.symbol}</div>
        </div>
        <div class="text-right">
          <div class="font-bold">$${p.price ? p.price.toLocaleString(undefined,{maximumFractionDigits:0}) : '—'}</div>
          <div class="text-sm ${p.change >= 0 ? 'text-emerald-400' : 'text-red-400'}">
            ${p.change ? (p.change>=0?'+':'')+p.change.toFixed(2)+'%' : '—'}
          </div>
        </div>
      </div>
    `;
    addTilt(div);
    box.appendChild(div);
  });
}

// ===================== THREE.JS MAXIMUM CHART =====================
let scene, camera, renderer, composer, particles, line;
let animationId = null;
let threeInitialized = false;

function initThree() {
  if (threeInitialized) return;
  threeInitialized = true;

  const container = document.getElementById('three-container');
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Scene
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x03050c, 0.002);

  // Camera
  camera = new THREE.PerspectiveCamera(60, width/height, 0.1, 1000);
  camera.position.set(0, 20, 90);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ReinhardToneMapping;
  container.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0x404040, 0.6);
  scene.add(ambient);

  const pointLight = new THREE.PointLight(0x22d3ee, 1.5, 200);
  pointLight.position.set(30, 40, 40);
  scene.add(pointLight);

  // ===== PARTICLE SYSTEM =====
  const particleCount = 1800;
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);

  const color1 = new THREE.Color(0x22d3ee);
  const color2 = new THREE.Color(0xf472b6);

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    positions[i3] = (Math.random() - 0.5) * 160;
    positions[i3+1] = (Math.random() - 0.5) * 60;
    positions[i3+2] = (Math.random() - 0.5) * 80;

    const mixed = color1.clone().lerp(color2, Math.random());
    colors[i3] = mixed.r;
    colors[i3+1] = mixed.g;
    colors[i3+2] = mixed.b;

    sizes[i] = Math.random() * 2.5 + 0.5;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const material = new THREE.PointsMaterial({
    size: 1.8,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });

  particles = new THREE.Points(geometry, material);
  scene.add(particles);

  // ===== GLOWING LINE =====
  const curvePoints = [];
  for (let i = 0; i <= 100; i++) {
    const t = i / 100;
    const x = (t - 0.5) * 140;
    const y = Math.sin(t * Math.PI * 3) * 18 + Math.cos(t * Math.PI * 1.5) * 8;
    curvePoints.push(new THREE.Vector3(x, y, 0));
  }
  const curve = new THREE.CatmullRomCurve3(curvePoints);
  const tubeGeometry = new THREE.TubeGeometry(curve, 200, 0.7, 8, false);
  const tubeMaterial = new THREE.MeshBasicMaterial({
    color: 0xf472b6,
    transparent: true,
    opacity: 0.9
  });
  line = new THREE.Mesh(tubeGeometry, tubeMaterial);
  scene.add(line);

  // ===== BLOOM =====
  const renderScene = new THREE.RenderPass(scene, camera);
  const bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(width, height),
    1.8,   // strength
    0.6,   // radius
    0.2    // threshold
  );

  composer = new THREE.EffectComposer(renderer);
  composer.addPass(renderScene);
  composer.addPass(bloomPass);

  // Handle resize
  window.addEventListener('resize', () => {
    const w = container.clientWidth;
    const h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
  });

  // Start animation loop
  animate();
}

// Continuous animation
let time = 0;
function animate() {
  animationId = requestAnimationFrame(animate);
  time += 0.008;

  if (particles) {
    const positions = particles.geometry.attributes.position.array;
    for (let i = 0; i < positions.length; i += 3) {
      positions[i] += Math.sin(time + i) * 0.03;
      positions[i+1] += Math.cos(time * 0.7 + i) * 0.02;
      // wrap around
      if (positions[i] > 80) positions[i] = -80;
      if (positions[i] < -80) positions[i] = 80;
    }
    particles.geometry.attributes.position.needsUpdate = true;
    particles.rotation.y = time * 0.05;
  }

  if (line) {
    line.rotation.z = Math.sin(time * 0.3) * 0.05;
  }

  camera.position.x = Math.sin(time * 0.2) * 8;
  camera.lookAt(0, 0, 0);

  composer.render();
}

// ===================== INIT =====================
function init() {
  renderStories();
  fetchPrices();
  setInterval(fetchPrices, 15000);

  document.getElementById('trending').innerHTML = `
    <div class="flex justify-between py-2 border-b border-white/10"><span>Hunza in Winter</span><span class="text-cyan-400">11 min</span></div>
    <div class="flex justify-between py-2 border-b border-white/10"><span>AI Revolution</span><span class="text-cyan-400">8 min</span></div>
  `;
  document.getElementById('categories').innerHTML = `
    <span class="px-4 py-2 rounded-full bg-white/5 text-sm">Tech</span>
    <span class="px-4 py-2 rounded-full bg-white/5 text-sm">Travel</span>
    <span class="px-4 py-2 rounded-full bg-white/5 text-sm">Culture</span>
  `;
}

window.onload = init;
</script>
</body>
</html>
